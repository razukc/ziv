<text x="56" y="458" fill="#9aa6bc" font-size="11" letter-spacing="2"> DEVICE SCOPE: DESIGNED / DE-RISKED, NOT ON HARDWARE YET </text>
<rect x="40" y="590" width="1020" height="120" rx="10" fill="#1a202d" stroke="#2b3242"/>
<text x="56" y="608" fill="#9aa6bc" font-size="11" letter-spacing="2"> HONEST FRAMES (NOT A LAYER IN THE SYSTEM) </text>
<rect x="104" y="108" width="168" height="64" rx="8" fill="#1f2738" stroke="#7cc4ff" stroke-width="1.5"/>
<text x="188" y="134" fill="#7cc4ff" font-size="22" text-anchor="middle" dominant-baseline="central">●</text>
<text x="188" y="156" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> 🖥  Relay process (Python, FastAPI + WS)</text>
<rect x="213" y="108" width="168" height="64" rx="8" fill="#1f2738" stroke="#7cc4ff" stroke-width="1.5"/>
<text x="297" y="134" fill="#7cc4ff" font-size="22" text-anchor="middle" dominant-baseline="central">●</text>
<text x="297" y="156" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> ziv_relay.py  —  MessageGate + TurnTimeline + TurnEvent vocabulary </text>
<rect x="322" y="108" width="168" height="64" rx="8" fill="#1f2738" stroke="#7cc4ff" stroke-width="1.5"/>
<text x="406" y="134" fill="#7cc4ff" font-size="22" text-anchor="middle" dominant-baseline="central">●</text>
<text x="406" y="156" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> ziv_store.py  —  wearer memory (atomic JSON) + capped inbox </text>
<rect x="431" y="108" width="168" height="64" rx="8" fill="#1f2738" stroke="#7cc4ff" stroke-width="1.5"/>
<text x="515" y="134" fill="#7cc4ff" font-size="22" text-anchor="middle" dominant-baseline="central">●</text>
<text x="515" y="156" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> ziv_server.py  —  WS transport /api/ziv/message /api/ziv/timing /inject/audio health </text>
<rect x="540" y="108" width="168" height="64" rx="8" fill="#1f2738" stroke="#7cc4ff" stroke-width="1.5"/>
<text x="624" y="134" fill="#7cc4ff" font-size="22" text-anchor="middle" dominant-baseline="central">●</text>
<text x="624" y="156" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> Generated timing module  (docs/haptic-timing.json → spec envelope, no hand-copied numbers) </text>
<rect x="649" y="108" width="168" height="64" rx="8" fill="#1f2738" stroke="#7cc4ff" stroke-width="1.5"/>
<text x="733" y="134" fill="#7cc4ff" font-size="22" text-anchor="middle" dominant-baseline="central">●</text>
<text x="733" y="156" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> QEMU ladder  —  bench binary + boot app + derived-fixture differ (firmware de-risking) </text>
<rect x="322" y="258" width="168" height="64" rx="8" fill="#1f2738" stroke="#7cc4ff" stroke-width="1.5"/>
<text x="406" y="284" fill="#7cc4ff" font-size="22" text-anchor="middle" dominant-baseline="central">●</text>
<text x="406" y="306" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> 📱 Phone PWA  (Vibration API, zero hand-copied timing) </text>
<rect x="649" y="258" width="168" height="64" rx="8" fill="#1f2738" stroke="#7cc4ff" stroke-width="1.5"/>
<text x="733" y="284" fill="#7cc4ff" font-size="22" text-anchor="middle" dominant-baseline="central">●</text>
<text x="733" y="306" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> 👤 Friend's phone  (text-side of the conversation) </text>
<rect x="241" y="408" width="168" height="64" rx="8" fill="#1f2738" stroke="#7cc4ff" stroke-width="1.5"/>
<text x="325" y="434" fill="#7cc4ff" font-size="22" text-anchor="middle" dominant-baseline="central">●</text>
<text x="325" y="456" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> Wristband (ESP32-S3 N16R8 + 6× DRV2605L + 6 LRAs + 6 chord keys + I2S mic + LiPo)  —  scoped / de-risked, not flashed yet </text>
<rect x="486" y="408" width="168" height="64" rx="8" fill="#1f2738" stroke="#7cc4ff" stroke-width="1.5"/>
<text x="570" y="434" fill="#7cc4ff" font-size="22" text-anchor="middle" dominant-baseline="central">●</text>
<text x="570" y="456" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> Chord input  (6-key debounce + chord decode + text buffer)  —  not built yet </text>
<rect x="731" y="408" width="168" height="64" rx="8" fill="#1f2738" stroke="#7cc4ff" stroke-width="1.5"/>
<text x="815" y="434" fill="#7cc4ff" font-size="22" text-anchor="middle" dominant-baseline="central">●</text>
<text x="815" y="456" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> Device mic  (I2S → WAV/Opus frames → WS binary)  —  not built yet </text>
<rect x="758" y="108" width="168" height="64" rx="8" fill="#1f2738" stroke="#7cc4ff" stroke-width="1.5"/>
<text x="842" y="134" fill="#7cc4ff" font-size="22" text-anchor="middle" dominant-baseline="central">●</text>
<text x="842" y="156" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> Nebius Token Factory  (Nemotron-3-Nano-Omni, audio-in / text-out) </text>
<rect x="867" y="108" width="168" height="64" rx="8" fill="#1f2738" stroke="#7cc4ff" stroke-width="1.5"/>
<text x="951" y="134" fill="#7cc4ff" font-size="22" text-anchor="middle" dominant-baseline="central">●</text>
<text x="951" y="156" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> Scheduled jobs / heartbeat  (the always-on relay presence) </text>
<rect x="176" y="555" width="200" height="70" rx="8" fill="#1a2a2c" stroke="#5fd0a0" stroke-width="1.5"/>
<text x="276" y="584" fill="#5fd0a0" font-size="22" text-anchor="middle" dominant-baseline="central">◆</text>
<text x="276" y="606" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> always-on is the relay (24/7 presence); the wristband sleeps between events and wakes on button / chord / mic / WiFi activity </text>
<rect x="372" y="555" width="200" height="70" rx="8" fill="#1a2a2c" stroke="#5fd0a0" stroke-width="1.5"/>
<text x="472" y="584" fill="#5fd0a0" font-size="22" text-anchor="middle" dominant-baseline="central">◆</text>
<text x="472" y="606" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> phone is the visible output channel today (dev band), not a flashed wrist </text>
<rect x="-100" y="255" width="200" height="70" rx="8" fill="#1a2a2c" stroke="#5fd0a0" stroke-width="1.5"/>
<text x="0" y="284" fill="#5fd0a0" font-size="22" text-anchor="middle" dominant-baseline="central">◆</text>
<text x="0" y="306" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> friend reads the reply as text on their phone / relay log — no speaker</text>
<rect x="568" y="555" width="200" height="70" rx="8" fill="#1a2a2c" stroke="#5fd0a0" stroke-width="1.5"/>
<text x="668" y="584" fill="#5fd0a0" font-size="22" text-anchor="middle" dominant-baseline="central">◆</text>
<text x="668" y="606" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> full queue refusals: gate returns message:rejected (reason: queue_full); server maps to HTTP 429; client shows \"wrist is busy\" + re-arms its own redial on free: true close </text>
<rect x="764" y="555" width="200" height="70" rx="8" fill="#1a2a2c" stroke="#5fd0a0" stroke-width="1.5"/>
<text x="864" y="584" fill="#5fd0a0" font-size="22" text-anchor="middle" dominant-baseline="central">◆</text>
<text x="864" y="606" fill="#dfe6f2" font-size="12" text-anchor="middle" font-weight="600"> wrist build is scoped + de-risked (QEMU ladder, bring-up stages A-F) but not on hardware yet </text>
