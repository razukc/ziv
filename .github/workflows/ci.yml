name: CI

on:
  push:
    branches: [main, product]
  pull_request:
    branches: [main, product]

jobs:
  relay:
    name: Relay — core, store, app, reference renderer, conformance oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Timing spec drift guard (every generated consumer)
        run: python tools/haptic_timing.py
      - name: Wire schemas are current
        run: |
          python -m ziv.wire /tmp/schema-check >/dev/null
          diff -r /tmp/schema-check schema
      - name: Conformance oracle is in sync with its golden timelines
        run: python conformance/run.py --check
      - name: Build the web renderer (the integration tests drive its headless device)
        working-directory: client
        run: |
          npm ci
          npm run build
      - name: Python suite (core, store, relay, reference, conformance, integration)
        run: python -X utf8 -m pytest -q

  renderers:
    name: Renderers — client and console build and test, conformance across players
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the package
        run: pip install -e .
      - name: Client — typecheck, test, build
        working-directory: client
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Console — generated types current, typecheck, test, build
        working-directory: console
        run: |
          npm ci
          npm run gen:types -- --check
          npm run typecheck
          npm test
          npm run build
      - name: Conformance — the web renderer against the reference
        run: |
          python conformance/run.py --player "node client/dist/conformance.js" --profile single_actuator
          python conformance/run.py --player "node client/dist/conformance.js" --profile six_actuator

  browser:
    name: Browser — Playwright drives the client and the console against a live relay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the package and a Chromium that can launch
        run: |
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Build both front ends
        run: |
          (cd client && npm ci && npm run build)
          (cd console && npm ci && npm run build)
      - name: Browser tier
        run: python -X utf8 -m pytest -q -m e2e tests/e2e

  firmware:
    name: Firmware — bench, rung-1 host demo, band host suite, conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package (the conformance runner imports the reference)
        run: pip install -e .
      - name: haptic_out bench (mock DRV2605L)
        run: python firmware/haptic_out/run_tests.py
      - name: ziv_qemu rung-1 host demo and HAP fixture
        working-directory: firmware/app/ziv_qemu
        run: python run_ziv_tests.py
      - name: Band host suite — decoder, queue, turn compiler, transport seam, conformance player
        run: python firmware/band/run_band_tests.py

  qemu-boot:
    name: QEMU boot — ESP32-S3 images build, the demo's HAP timeline matches the bench, the band boots
    # Blocking since its first green run on GitHub (run 42212509684, 2026-11-06).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Espressif QEMU (the fork with the esp32s3 machine), its shared libraries, a host gcc for the bench side
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsdl2-2.0-0 libslirp0 gcc libc6-dev
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
          # the tool is optional, so export.sh never puts it on PATH
          ls -d "${IDF_TOOLS_PATH:-$HOME/.espressif}"/tools/qemu-xtensa/*/qemu/bin | head -1 >> "$GITHUB_PATH"
      - name: Bench side — host demo, its HAP log (run_ziv_tests.py deletes its own copy, so emit it again)
        working-directory: firmware/app/ziv_qemu
        run: |
          python3 run_ziv_tests.py
          ./host_demo --hap-log > bench_hap.log
      - name: Build ziv_qemu (rung 1)
        working-directory: firmware/app/ziv_qemu
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
      - name: Boot ziv_qemu under QEMU — bounded capture (rung 1)
        # -icount: deterministic virtual time (docs/QEMU_SIMULATION_LADDER.md rung 2);
        # the ROM's start-up loop costs ~35 s of host time in that mode, hence the cap.
        run: |
          . "$IDF_PATH/export.sh"
          qemu-system-xtensa --version | head -1
          QEMU_UNTIL="$(tail -1 firmware/app/ziv_qemu/bench_hap.log)" \
            firmware/qemu_capture.sh firmware/app/ziv_qemu firmware/app/ziv_qemu/qemu_boot.log 600
      - name: Rung 2 — the boot's HAP timeline vs the bench (derived fixture)
        # tools/qemu_timeline.py's chatter filter predates a real boot log: it
        # does not know the ROM's lines (Build:, rst:, SPIWP:, mode:, load:,
        # entry) or W/E log levels and exits 2 on them, so it is fed the HAP
        # lines until it learns them (the saved capture keeps everything).
        working-directory: firmware/app/ziv_qemu
        run: |
          grep '^HAP ' qemu_boot.log > qemu_hap.log
          python3 ../../../tools/qemu_timeline.py bench_hap.log qemu_hap.log
      - name: Build the band (firmware/band/esp_project; fetches esp_websocket_client from the registry)
        working-directory: firmware/band/esp_project
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
      - name: Boot the band under QEMU — mock bus, no radio, transport in backoff
        run: |
          . "$IDF_PATH/export.sh"
          QEMU_UNTIL='transport: connect failed' QEMU_UNTIL_COUNT=3 \
            firmware/qemu_capture.sh firmware/band/esp_project firmware/band/esp_project/qemu_boot.log 600
          log=firmware/band/esp_project/qemu_boot.log
          grep -q 'Calling app_main' "$log"
          grep -q 'wifi: unavailable' "$log"
          grep -q '^HAP .* BUZZ PATTERN ramp-up' "$log"
          test "$(grep -c 'transport: connect failed' "$log")" -ge 2
          ! grep -q 'Guru Meditation\|abort()\|Task watchdog' "$log"
          test "$(grep -c '^rst:' "$log")" -eq 1   # one power-on reset, no reboot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-boot-logs
          path: |
            firmware/app/ziv_qemu/qemu_boot.log
            firmware/app/ziv_qemu/bench_hap.log
            firmware/band/esp_project/qemu_boot.log
