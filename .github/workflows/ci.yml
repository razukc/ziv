name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ziv:
    name: Ziv — proof block (4 suites)
    # Pinned image: `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19 —
    # bump deliberately, not by surprise (see actions/runner-images#14748).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # prove.py runs pytest as a child interpreter and carries no -X utf8 of
    # its own, so the encoding guarantee the old pytest step held lives here
    # instead — the suite fails on a non-UTF-8 locale (see bea6b49).
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install agent deps
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # One command, one block: the hermetic relay suite, the 274-check
      # haptic bench, the QEMU host suite, and the timing drift guard.
      # These steps used to be hand-written copies of prove.py's CHECKS
      # list — the same hand-duplication prove.py exists to end, and how the
      # haptic bench fell out of CI entirely while remaining the largest
      # number the README prints. prove.py is the single source now.
      - name: Proof block (4 suites)
        run: |
          python tools/prove.py

  qemu-boot:
    name: QEMU boot — ESP32-S3 app boots the demo (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bench side (real today) — host demo HAP log + differ
        working-directory: firmware/app/ziv_qemu
        run: |
          python run_ziv_tests.py

      # ⚠ verify-at-install: the one missing piece. Until filled, the two
      # steps below stay skipped and this job is informational only.
      # Contents (see docs/QEMU_WINDOWS_INSTALL.md for the map):
      #   - ESP-IDF (docker image espressif/idf, or idf.py on the runner)
      #   - Espressif's QEMU fork: `idf_tools.py install qemu-xtensa`
      #     (upstream QEMU has no ESP32-S3 machine)
      #   - then: echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Provision ESP-IDF + Espressif QEMU (the one missing piece)
        id: idf
        if: ${{ false }}
        # A step must declare `run` or `uses` to be a valid workflow file —
        # without it GitHub rejects the whole workflow at parse time and
        # every job (including the ziv suite) is never created. This stays
        # disabled until filled in; the no-op run line is only the valid
        # placeholder shape.
        run: |
          echo "verify-at-install: fill this step — see docs/QEMU_WINDOWS_INSTALL.md"

      - name: Boot the app under QEMU (bounded capture)
        if: steps.idf.outputs.available == 'true'
        working-directory: firmware/app/ziv_qemu
        run: |
          timeout 60 idf.py qemu > qemu.log 2>&1 || true

      - name: Rung-2 equivalence — boot log vs derived fixture
        if: steps.idf.outputs.available == 'true'
        working-directory: firmware/app/ziv_qemu
        run: |
          python ../../../tools/qemu_timeline.py bench_hap.log qemu.log
