name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ziv:
    name: Ziv — hermetic suite + timing drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install agent deps
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Hermetic Ziv test suite (bare pytest, e2e deselected)
        working-directory: agent
        run: |
          python -X utf8 -m pytest -m "not e2e" -q

      - name: Haptic timing drift guard (all 7 generated consumers)
        run: |
          python tools/haptic_timing.py

      - name: QEMU rung-2 bench (host demo vs derived fixture)
        working-directory: firmware/app/ziv_qemu
        run: |
          python run_ziv_tests.py

  qemu-boot:
    name: QEMU boot — ESP32-S3 app boots the demo (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bench side (real today) — host demo HAP log + differ
        working-directory: firmware/app/ziv_qemu
        run: |
          python run_ziv_tests.py

      # ⚠ verify-at-install: the one missing piece. Until filled, the two
      # steps below stay skipped and this job is informational only.
      # Contents (see docs/QEMU_WINDOWS_INSTALL.md for the map):
      #   - ESP-IDF (docker image espressif/idf, or idf.py on the runner)
      #   - Espressif's QEMU fork: `idf_tools.py install qemu-xtensa`
      #     (upstream QEMU has no ESP32-S3 machine)
      #   - then: echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Provision ESP-IDF + Espressif QEMU (the one missing piece)
        id: idf
        if: ${{ false }}

      - name: Boot the app under QEMU (bounded capture)
        if: steps.idf.outputs.available == 'true'
        working-directory: firmware/app/ziv_qemu
        run: |
          timeout 60 idf.py qemu > qemu.log 2>&1 || true

      - name: Rung-2 equivalence — boot log vs derived fixture
        if: steps.idf.outputs.available == 'true'
        working-directory: firmware/app/ziv_qemu
        run: |
          python ../../../tools/qemu_timeline.py bench_hap.log qemu.log
