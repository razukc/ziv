[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ziv"
version = "0.1.0.dev0"
description = "Ziv relay: a haptic message channel for deaf-blind wearers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=12",
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "playwright>=1.50",
]

[project.scripts]
ziv-relay = "ziv.cli:main"

[tool.setuptools.packages.find]
include = ["ziv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: drives a real browser against an in-process relay; deselected by default",
  "device: needs a device toolchain (ESP-IDF, Android); deselected by default",
]
addopts = "-m 'not e2e and not device'"
